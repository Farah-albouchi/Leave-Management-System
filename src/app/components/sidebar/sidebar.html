<div
  class="sidebar h-screen flex flex-col"
  [ngClass]="{ 'sidebar-collapsed': isSidebarCollapsed }"
>
  <div class="sidebar-header">
    <a href="#" class="sidebar-logo flex items-center gap-2">
      <div class="icon-bg">
        <fa-icon size="lg" class="logo" [icon]="faCalendar"></fa-icon>
      </div>
      <div *ngIf="!isSidebarCollapsed">
        <h2 style="color: #233b62; font-weight: bold">LeaveSync</h2>
        <p style="font-size: small; color: rgb(155, 151, 151)">
          {{ role === 'admin' ? 'Admin Portal' : 'Employee Portal' }}
        </p>
      </div>
    </a>
  </div>
  <div class="border-1 border-gray-200"></div>
  <div class="flex flex-col justify-between h-full">
    <div class="sidebar-menu">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.path"
        routerLinkActive="active-link"
        class="sidebar-item"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <fa-icon [icon]="item.icon" class="sidebar-icon"></fa-icon>
        <div *ngIf="!isSidebarCollapsed">
          <p class="sidebar-text">{{ item.label }}</p>
        </div>
      </a>
    </div>
    
    <button 
    (click)="logout()"
    [disabled]="isLoggingOut"
    class="flex items-center w-full px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
  >
    <svg 
      *ngIf="!isLoggingOut"
      class="w-6 h-6 mr-3 text-red-500" 
      fill="none" 
      stroke="currentColor" 
      viewBox="0 0 24 24"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
    </svg>
    <svg 
      *ngIf="isLoggingOut"
      class="animate-spin w-6 h-6 mr-3 text-red-500" 
      fill="none" 
      viewBox="0 0 24 24"
    >
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    {{ isLoggingOut ? 'Signing out...' : 'Sign Out' }}
  </button>
  </div>
</div>
