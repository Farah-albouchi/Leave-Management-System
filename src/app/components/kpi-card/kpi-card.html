<div [class]="getCardClasses()">
  <!-- Loading state -->
  <div *ngIf="isLoading" class="animate-pulse">
    <div class="flex items-center justify-between mb-4">
      <div class="h-4 bg-gray-300 rounded w-1/3"></div>
      <div class="h-6 w-6 bg-gray-300 rounded"></div>
    </div>
    <div class="h-8 bg-gray-300 rounded w-1/2 mb-2"></div>
    <div class="h-3 bg-gray-300 rounded w-2/3"></div>
  </div>

  <!-- Content state -->
  <div *ngIf="!isLoading" class="space-y-4">
    <!-- Header -->
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-medium text-gray-600">{{ data.title }}</h3>
      <i [class]="data.icon + ' ' + getIconClasses()"></i>
    </div>

    <!-- Value -->
    <div>
      <div [class]="getValueClasses()">{{ data.value }}</div>
      <p *ngIf="data.subtitle" class="text-sm text-gray-500 mt-1">{{ data.subtitle }}</p>
    </div>

    <!-- Trend (if available) -->
    <div *ngIf="data.trend" [class]="getTrendClasses()">
      <i [class]="getTrendIcon()"></i>
      <span>{{ data.trend.value }}{{ data.trend.direction === 'up' ? '+' : data.trend.direction === 'down' ? '-' : '' }}</span>
      <span>{{ data.trend.label }}</span>
    </div>
  </div>
</div>
