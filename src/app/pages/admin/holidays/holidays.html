<div class="p-6">
    <h1 class="text-3xl font-bold mb-1">Holiday Calendar</h1>
    <p class="text-gray-500 mb-6">Company-wide public holidays</p>
  
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Calendar -->
      <div class="lg:col-span-2 p-6 bg-white rounded-lg shadow">
        <div class="flex justify-between items-center mb-4">
          <button (click)="prevMonth()" class="text-lg px-2">←</button>
          <span class="text-xl font-semibold">{{ currentMonth | date: 'MMMM yyyy' }}</span>
          <button (click)="nextMonth()" class="text-lg px-2">→</button>
        </div>
  
        <div class="grid grid-cols-7 text-center font-medium text-gray-700 mb-2">
          <div *ngFor="let day of weekDays">{{ day }}</div>
        </div>
  
        <div class="grid grid-cols-7 gap-1 text-center">
          <div
            *ngFor="let day of calendarDays"
            class="h-16 flex items-center justify-center rounded-lg text-sm relative"
            [ngClass]="{
              'text-gray-400': day.isOtherMonth,
              'bg-red-100 text-red-800': isHoliday(day.date),
              'border-2 border-blue-500': isToday(day.date)
            }"
          >
            {{ day.date.getDate() }}
            <span
            *ngIf="isHoliday(day.date)"
            class="absolute top-0 left-0 bg-red-600 text-white text-[9px] px-1 rounded-bl-md"
          >
            {{ isHoliday(day.date)?.name }}
          </span>
          
          </div>
        </div>
      </div>
  
      <!-- Sidebar -->
      <div class="space-y-6">
        <div class="bg-white rounded-lg p-4 shadow">
          <h3 class="text-xl font-bold mb-3">Upcoming Holidays</h3>
          <div *ngFor="let h of upcomingHolidays" class="mb-2">
            <span class="bg-red-200 text-red-800 text-xs px-2 py-1 rounded-full">
              {{ h.name }}
            </span>
            <p class="text-sm">{{ h.date | date: 'dd/MM/yyyy' }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
