<div class="bg-white rounded-xl shadow-sm p-4 border border-blue-200">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-semibold">Recent Leave Requests</h2>
    <button 
      (click)="viewAllRequests()"
      class="text-blue-600 hover:text-blue-800 text-sm font-medium"
    >
      View All
    </button>
  </div>
  
  <hr class="mb-4 border-1 border-blue-100" />

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg">
    <div class="flex items-center justify-between">
      <div class="flex items-center">
        <svg class="w-4 h-4 text-red-600 mr-2" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
        </svg>
        <p class="text-sm text-red-700">{{ errorMessage }}</p>
      </div>
      <button 
        (click)="refreshRequests()"
        class="text-red-600 hover:text-red-800 text-xs underline"
      >
        Retry
      </button>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="space-y-3">
    <div *ngFor="let i of [1,2,3]" class="flex justify-between items-center bg-gray-50 rounded-lg p-4 animate-pulse">
      <div class="space-y-2">
        <div class="flex items-center gap-2">
          <div class="h-4 bg-gray-200 rounded w-24"></div>
          <div class="h-5 bg-gray-200 rounded-full w-16"></div>
        </div>
        <div class="h-3 bg-gray-200 rounded w-32"></div>
      </div>
      <div class="h-4 bg-gray-200 rounded w-12"></div>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && leaveRequests.length === 0 && !errorMessage" class="text-center py-8">
    <div class="flex flex-col items-center space-y-3">
      <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
      </svg>
      <div>
        <h3 class="text-sm font-medium text-gray-900">No recent requests</h3>
        <p class="text-sm text-gray-500">You haven't submitted any leave requests recently.</p>
      </div>
    </div>
  </div>

  <!-- Leave Requests List -->
  <div *ngIf="!isLoading && leaveRequests.length > 0" class="space-y-3">
    <div 
      *ngFor="let request of leaveRequests" 
      class="flex justify-between items-center bg-gray-50 rounded-lg p-4 hover:bg-gray-100 transition-colors group"
    >
      <div class="flex-1">
        <div class="flex items-center gap-2 mb-1">
          <p class="font-semibold text-gray-900">{{ request.type }}</p>
          <span
            class="text-xs font-medium px-2 py-0.5 rounded-full"
            [ngClass]="[request.statusBg, request.statusColor]"
          >
            {{ request.status }}
          </span>
        </div>
        <p class="text-sm text-gray-500">{{ request.dateRange }}</p>
      </div>
      
      <div class="flex items-center space-x-4">
        <div class="text-sm font-semibold text-gray-900">
          {{ request.days }}
        </div>
        
        <!-- Action Buttons -->
        <div class="flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <button 
            (click)="viewRequestDetails(request.id)"
            class="text-blue-600 hover:text-blue-800 text-xs"
            title="View Details"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
            </svg>
          </button>
          
          <button 
            *ngIf="request.canCancel"
            (click)="cancelRequest(request.id)"
            class="text-red-600 hover:text-red-800 text-xs"
            title="Cancel Request"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- View All Button (when there are requests) -->
  <div *ngIf="!isLoading && leaveRequests.length > 0" class="mt-4 pt-4 border-t border-gray-100">
    <button 
      (click)="viewAllRequests()"
      class="w-full text-center text-blue-600 hover:text-blue-800 text-sm font-medium py-2 hover:bg-blue-50 rounded-lg transition"
    >
      View All Leave Requests →
    </button>
  </div>
</div>
