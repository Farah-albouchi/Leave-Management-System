<div class="app-container" [ngClass]="{ 'sidebar-collapsed': isSidebarCollapsed }">
  <div class="position-relative">
    <app-sidebar
      [role]="role"
      [isSidebarCollapsed]="isSidebarCollapsed"
      (sidebarToggle)="onSidebarToggle()"
    ></app-sidebar>
  </div>

  <main class="content">
    <app-navbar (toggleSidebar)="onSidebarToggle()"></app-navbar>
    <router-outlet></router-outlet>
  </main>
</div>
